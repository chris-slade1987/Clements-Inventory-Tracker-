<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" role="img" aria-label="Cockroach anatomy: antennae, head, pronotum, wings, legs and cerci">
  <rect width="760" height="560" fill="#ffffff"/>
  <text x="380" y="40" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#0f172a">Parts to Know</text>
  <text x="380" y="64" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#64748b">Top-down view — the pronotum's markings are the #1 ID clue</text>

  <!-- roach body, centered around x=380 -->
  <g transform="translate(380 300)">
    <!-- legs (draw under body) -->
    <g stroke="#8a5a2b" stroke-width="6" stroke-linecap="round" fill="none">
      <path d="M-55,-70 C -110,-110 -150,-120 -185,-118"/>
      <path d="M-62,-10 C -120,-20 -165,-15 -200,-5"/>
      <path d="M-55,55 C -110,80 -150,110 -175,140"/>
      <path d="M55,-70 C 110,-110 150,-120 185,-118"/>
      <path d="M62,-10 C 120,-20 165,-15 200,-5"/>
      <path d="M55,55 C 110,80 150,110 175,140"/>
    </g>
    <!-- abdomen -->
    <ellipse cx="0" cy="35" rx="72" ry="120" fill="#b07a3c"/>
    <!-- wings -->
    <path d="M0,-55 C 60,-40 78,60 30,150 L0,120 Z" fill="#9a6832"/>
    <path d="M0,-55 C -60,-40 -78,60 -30,150 L0,120 Z" fill="#a87236"/>
    <line x1="0" y1="-55" x2="0" y2="150" stroke="#7c5227" stroke-width="2"/>
    <!-- pronotum (shield) -->
    <ellipse cx="0" cy="-95" rx="56" ry="44" fill="#7c4a20"/>
    <ellipse cx="0" cy="-95" rx="56" ry="44" fill="none" stroke="#5b3617" stroke-width="2"/>
    <!-- head -->
    <ellipse cx="0" cy="-150" rx="26" ry="22" fill="#5b3617"/>
    <circle cx="-11" cy="-155" r="4" fill="#1f2937"/>
    <circle cx="11" cy="-155" r="4" fill="#1f2937"/>
    <!-- antennae -->
    <g stroke="#5b3617" stroke-width="5" fill="none" stroke-linecap="round">
      <path d="M-14,-166 C -70,-215 -120,-225 -150,-210"/>
      <path d="M14,-166 C 70,-215 120,-225 150,-210"/>
    </g>
    <!-- cerci -->
    <g stroke="#7c5227" stroke-width="5" fill="none" stroke-linecap="round">
      <path d="M-18,150 C -26,178 -30,190 -34,205"/>
      <path d="M18,150 C 26,178 30,190 34,205"/>
    </g>
  </g>

  <!-- labels + leader lines -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0f172a" stroke="none">
    <g stroke="#10b981" stroke-width="1.5">
      <line x1="230" y1="82" x2="300" y2="120"/>
      <line x1="150" y1="150" x2="230" y2="175"/>
      <line x1="150" y1="235" x2="270" y2="205"/>
      <line x1="600" y1="300" x2="455" y2="330"/>
      <line x1="600" y1="150" x2="470" y2="205"/>
      <line x1="560" y1="450" x2="420" y2="470"/>
    </g>
    <g font-weight="bold">
      <text x="150" y="78">Antennae</text>
      <text x="60" y="146">Head &amp; eyes</text>
      <text x="40" y="231">Pronotum (shield)</text>
      <text x="610" y="296">Wing covers</text>
      <text x="610" y="146">Legs (six)</text>
      <text x="565" y="446">Cerci</text>
    </g>
    <g font-size="11.5" fill="#475569">
      <text x="150" y="95">long, thread-like feelers</text>
      <text x="60" y="163">senses; not for ID</text>
      <text x="40" y="248">stripes / figure-8 = ID clue</text>
      <text x="610" y="313">length varies by species</text>
      <text x="610" y="163">spiny, built for speed</text>
      <text x="565" y="463">air sensors at the rear</text>
    </g>
  </g>
</svg>
