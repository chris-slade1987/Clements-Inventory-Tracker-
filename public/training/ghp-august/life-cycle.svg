<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-label="Cockroach life cycle: egg case (ootheca), nymph, adult">
  <rect width="760" height="340" fill="#ffffff"/>
  <text x="380" y="36" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#0f172a">Incomplete Metamorphosis</text>
  <text x="380" y="60" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#64748b">A nymph already looks like a small adult and grows with each molt</text>

  <!-- stage cards -->
  <g font-family="Arial, Helvetica, sans-serif">
    <!-- EGG -->
    <g transform="translate(60 110)">
      <rect width="180" height="170" rx="16" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
      <ellipse cx="90" cy="72" rx="42" ry="26" fill="#8a5a2b"/>
      <g stroke="#5b3617" stroke-width="1.5"><line x1="60" y1="52" x2="60" y2="92"/><line x1="75" y1="48" x2="75" y2="96"/><line x1="90" y1="46" x2="90" y2="98"/><line x1="105" y1="48" x2="105" y2="96"/><line x1="120" y1="52" x2="120" y2="92"/></g>
      <text x="90" y="128" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">Egg (ootheca)</text>
      <text x="90" y="148" text-anchor="middle" font-size="11.5" fill="#475569">purse-like case,</text>
      <text x="90" y="163" text-anchor="middle" font-size="11.5" fill="#475569">holds ~30–40 eggs</text>
    </g>
    <!-- NYMPH -->
    <g transform="translate(290 110)">
      <rect width="180" height="170" rx="16" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
      <g transform="translate(90 70)">
        <ellipse cx="0" cy="6" rx="20" ry="30" fill="#4b3016"/>
        <ellipse cx="0" cy="-24" rx="13" ry="11" fill="#3a2510"/>
        <g stroke="#3a2510" stroke-width="3" stroke-linecap="round"><path d="M-6,-32 C -22,-46 -34,-48 -42,-44"/><path d="M6,-32 C 22,-46 34,-48 42,-44"/></g>
        <g stroke="#4b3016" stroke-width="3" stroke-linecap="round"><line x1="-16" y1="-8" x2="-34" y2="-16"/><line x1="-18" y1="8" x2="-38" y2="6"/><line x1="-15" y1="24" x2="-32" y2="34"/><line x1="16" y1="-8" x2="34" y2="-16"/><line x1="18" y1="8" x2="38" y2="6"/><line x1="15" y1="24" x2="32" y2="34"/></g>
      </g>
      <text x="90" y="128" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">Nymph</text>
      <text x="90" y="148" text-anchor="middle" font-size="11.5" fill="#475569">wingless, darker;</text>
      <text x="90" y="163" text-anchor="middle" font-size="11.5" fill="#475569">molts through instars</text>
    </g>
    <!-- ADULT -->
    <g transform="translate(520 110)">
      <rect width="180" height="170" rx="16" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
      <g transform="translate(90 70)">
        <ellipse cx="0" cy="8" rx="26" ry="38" fill="#b07a3c"/>
        <path d="M0,-14 C 22,-6 26,34 10,52 L0,40 Z" fill="#9a6832"/>
        <path d="M0,-14 C -22,-6 -26,34 -10,52 L0,40 Z" fill="#a87236"/>
        <ellipse cx="0" cy="-24" rx="18" ry="14" fill="#7c4a20"/>
        <rect x="-5" y="-30" width="3" height="16" fill="#3a2510"/><rect x="2" y="-30" width="3" height="16" fill="#3a2510"/>
        <ellipse cx="0" cy="-44" rx="10" ry="8" fill="#5b3617"/>
        <g stroke="#5b3617" stroke-width="3" stroke-linecap="round"><path d="M-6,-50 C -24,-64 -38,-66 -46,-62"/><path d="M6,-50 C 24,-64 38,-66 46,-62"/></g>
        <g stroke="#8a5a2b" stroke-width="3" stroke-linecap="round"><line x1="-20" y1="-6" x2="-42" y2="-16"/><line x1="-22" y1="12" x2="-46" y2="10"/><line x1="-18" y1="30" x2="-40" y2="42"/><line x1="20" y1="-6" x2="42" y2="-16"/><line x1="22" y1="12" x2="46" y2="10"/><line x1="18" y1="30" x2="40" y2="42"/></g>
      </g>
      <text x="90" y="128" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">Adult</text>
      <text x="90" y="148" text-anchor="middle" font-size="11.5" fill="#475569">winged, reproduces —</text>
      <text x="90" y="163" text-anchor="middle" font-size="11.5" fill="#475569">cycle begins again</text>
    </g>
  </g>

  <!-- arrows -->
  <defs><marker id="ah" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto"><path d="M0,0 L8,5 L0,10 z" fill="#10b981"/></marker></defs>
  <g stroke="#10b981" stroke-width="2.5" fill="none" marker-end="url(#ah)">
    <line x1="244" y1="150" x2="286" y2="150"/>
    <line x1="474" y1="150" x2="516" y2="150"/>
  </g>
  <path d="M600,284 C 600,320 160,320 158,286" stroke="#10b981" stroke-width="2.5" fill="none" stroke-dasharray="6 5" marker-end="url(#ah)"/>
</svg>
