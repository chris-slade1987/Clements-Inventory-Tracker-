<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 420" role="img" aria-label="The four cockroach species compared by size, color and markings">
  <rect width="840" height="420" fill="#ffffff"/>
  <text x="420" y="36" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#0f172a">Meet the Four Species</text>
  <text x="420" y="58" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#64748b">Drawn to relative size — size, color, and markings are usually enough</text>
  <line x1="40" y1="300" x2="800" y2="300" stroke="#e2e8f0" stroke-width="2"/>
  <text x="40" y="320" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#94a3b8">standing on the same baseline for size comparison</text>

  <g font-family="Arial, Helvetica, sans-serif">
    <!-- GERMAN (small, tan, two dark stripes) -->
    <g transform="translate(120 300)">
      <g transform="translate(0 -44) scale(0.62)">
        <ellipse cx="0" cy="30" rx="40" ry="66" fill="#c79a5b"/>
        <ellipse cx="0" cy="-40" rx="30" ry="24" fill="#b98a45"/>
        <rect x="-14" y="-58" width="8" height="34" fill="#4b3016"/><rect x="6" y="-58" width="8" height="34" fill="#4b3016"/>
        <ellipse cx="0" cy="-66" rx="15" ry="12" fill="#8a5a2b"/>
        <g stroke="#8a5a2b" stroke-width="4" stroke-linecap="round" fill="none"><path d="M-8,-74 C -34,-96 -56,-98 -70,-92"/><path d="M8,-74 C 34,-96 56,-98 70,-92"/></g>
        <g stroke="#a87236" stroke-width="4" stroke-linecap="round"><line x1="-30" y1="-6" x2="-64" y2="-20"/><line x1="-32" y1="18" x2="-68" y2="16"/><line x1="-28" y1="42" x2="-60" y2="62"/><line x1="30" y1="-6" x2="64" y2="-20"/><line x1="32" y1="18" x2="68" y2="16"/><line x1="28" y1="42" x2="60" y2="62"/></g>
      </g>
      <text x="0" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">German</text>
      <text x="0" y="50" text-anchor="middle" font-size="12" fill="#0f5132" font-weight="bold">1/2–5/8 in</text>
      <text x="0" y="68" text-anchor="middle" font-size="11" fill="#475569">two dark stripes</text>
      <text x="0" y="83" text-anchor="middle" font-size="11" fill="#475569">kitchens/baths</text>
    </g>

    <!-- AMERICAN (large, reddish-brown, figure-8) -->
    <g transform="translate(340 300)">
      <g transform="translate(0 -96) scale(1.15)">
        <ellipse cx="0" cy="30" rx="40" ry="66" fill="#8f3d1e"/>
        <ellipse cx="0" cy="-40" rx="30" ry="24" fill="#7c3417"/>
        <path d="M-14,-52 C -6,-44 6,-44 14,-52 C 8,-36 -8,-36 -14,-52 Z" fill="#e8c26a"/>
        <ellipse cx="0" cy="-66" rx="15" ry="12" fill="#5b2610"/>
        <g stroke="#5b2610" stroke-width="4" stroke-linecap="round" fill="none"><path d="M-8,-74 C -40,-104 -68,-106 -84,-98"/><path d="M8,-74 C 40,-104 68,-106 84,-98"/></g>
        <g stroke="#7c3417" stroke-width="4" stroke-linecap="round"><line x1="-30" y1="-6" x2="-70" y2="-22"/><line x1="-32" y1="18" x2="-74" y2="16"/><line x1="-28" y1="42" x2="-66" y2="66"/><line x1="30" y1="-6" x2="70" y2="-22"/><line x1="32" y1="18" x2="74" y2="16"/><line x1="28" y1="42" x2="66" y2="66"/></g>
      </g>
      <text x="0" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">American</text>
      <text x="0" y="50" text-anchor="middle" font-size="12" fill="#0f5132" font-weight="bold">1.5–2 in</text>
      <text x="0" y="68" text-anchor="middle" font-size="11" fill="#475569">yellow figure-8</text>
      <text x="0" y="83" text-anchor="middle" font-size="11" fill="#475569">damp, drains</text>
    </g>

    <!-- ORIENTAL (medium, shiny dark/black, no marks) -->
    <g transform="translate(560 300)">
      <g transform="translate(0 -70) scale(0.88)">
        <ellipse cx="0" cy="30" rx="40" ry="66" fill="#2b2b30"/>
        <ellipse cx="0" cy="-40" rx="30" ry="24" fill="#232327"/>
        <ellipse cx="0" cy="-66" rx="15" ry="12" fill="#17171a"/>
        <g stroke="#17171a" stroke-width="4" stroke-linecap="round" fill="none"><path d="M-8,-74 C -36,-98 -60,-100 -74,-94"/><path d="M8,-74 C 36,-98 60,-100 74,-94"/></g>
        <g stroke="#3a3a40" stroke-width="4" stroke-linecap="round"><line x1="-30" y1="-6" x2="-66" y2="-20"/><line x1="-32" y1="18" x2="-70" y2="16"/><line x1="-28" y1="42" x2="-62" y2="64"/><line x1="30" y1="-6" x2="66" y2="-20"/><line x1="32" y1="18" x2="70" y2="16"/><line x1="28" y1="42" x2="62" y2="64"/></g>
        <ellipse cx="-14" cy="10" rx="8" ry="26" fill="#43434a" opacity="0.5"/>
      </g>
      <text x="0" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">Oriental</text>
      <text x="0" y="50" text-anchor="middle" font-size="12" fill="#0f5132" font-weight="bold">1–1.25 in</text>
      <text x="0" y="68" text-anchor="middle" font-size="11" fill="#475569">shiny black</text>
      <text x="0" y="83" text-anchor="middle" font-size="11" fill="#475569">cool &amp; damp</text>
    </g>

    <!-- BROWN-BANDED (small, light brown, two pale bands) -->
    <g transform="translate(740 300)">
      <g transform="translate(0 -42) scale(0.6)">
        <ellipse cx="0" cy="30" rx="40" ry="66" fill="#a9793f"/>
        <rect x="-40" y="-6" width="80" height="12" fill="#e6cd97"/>
        <rect x="-40" y="34" width="80" height="12" fill="#e6cd97"/>
        <ellipse cx="0" cy="-40" rx="30" ry="24" fill="#956a37"/>
        <ellipse cx="0" cy="-66" rx="15" ry="12" fill="#6f4c26"/>
        <g stroke="#6f4c26" stroke-width="4" stroke-linecap="round" fill="none"><path d="M-8,-74 C -34,-96 -56,-98 -70,-92"/><path d="M8,-74 C 34,-96 56,-98 70,-92"/></g>
        <g stroke="#956a37" stroke-width="4" stroke-linecap="round"><line x1="-30" y1="-6" x2="-64" y2="-20"/><line x1="-32" y1="18" x2="-68" y2="16"/><line x1="-28" y1="42" x2="-60" y2="62"/><line x1="30" y1="-6" x2="64" y2="-20"/><line x1="32" y1="18" x2="68" y2="16"/><line x1="28" y1="42" x2="60" y2="62"/></g>
      </g>
      <text x="0" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">Brown-banded</text>
      <text x="0" y="50" text-anchor="middle" font-size="12" fill="#0f5132" font-weight="bold">~1/2 in</text>
      <text x="0" y="68" text-anchor="middle" font-size="11" fill="#475569">two pale bands</text>
      <text x="0" y="83" text-anchor="middle" font-size="11" fill="#475569">dry, high &amp; spread</text>
    </g>
  </g>
</svg>
