<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Clements">
  <!-- Two overlapping circles: soft steel-blue (left) + lime green (right) -->
  <circle cx="46" cy="60" r="42" fill="#A9C3D2"/>
  <circle cx="74" cy="60" r="42" fill="#8CC63F"/>
  <!-- Leaf over the overlap, split down the midrib (medium left, deep green right) -->
  <path d="M60 18 C 41 40 41 80 60 102 L 60 18 Z" fill="#5AA35F"/>
  <path d="M60 18 C 79 40 79 80 60 102 L 60 18 Z" fill="#146A3A"/>
  <!-- Midrib + veins -->
  <g stroke="#CDE8A6" stroke-width="2.4" stroke-linecap="round" fill="none">
    <line x1="60" y1="24" x2="60" y2="96"/>
    <line x1="60" y1="40" x2="46" y2="34"/>
    <line x1="60" y1="40" x2="74" y2="34"/>
    <line x1="60" y1="56" x2="45" y2="50"/>
    <line x1="60" y1="56" x2="75" y2="50"/>
    <line x1="60" y1="72" x2="47" y2="67"/>
    <line x1="60" y1="72" x2="73" y2="67"/>
  </g>
</svg>
